[pytest]
# Run pytest from the nl2sql-backend/ directory:
#   .\.venv\Scripts\pytest tests/ -v --cov=app --cov-report=term-missing
#
# For CI:
#   pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --tb=short
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Disable irrelevant warnings from third-party libraries
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning:google.*

# Show 10 slowest tests
# --durations=10 can be added manually

markers =
    integration: tests that call Gemini or external services (slow)

# Default addopts for every run:
addopts = -v --tb=short
